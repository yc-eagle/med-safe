<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ocr</title>
</head>
<body>
<pre id="out">working…</pre>
<script src="/app/vendor/tesseract.min.js"></script>
<script>
const SHOTS = [
  ["en",  "/qa/live-demo/live-01-en.png",  "eng"],
  ["cmn", "/qa/live-demo/live-02-cmn.png", "chi_tra"],
  ["yue", "/qa/live-demo/live-03-yue.png", "chi_tra"]
];

function set(t){ document.getElementById('out').textContent = t; }

(async () => {
  const results = {};
  try {
    const worker = await Tesseract.createWorker("eng", 1, {
      workerPath: "/app/vendor/worker.min.js",
      corePath: "/app/vendor/",
      langPath: "/app/vendor",
      gzip: false,
      cacheMethod: "none",
      logger: () => {}
    });
    for (const [name, path, lang] of SHOTS) {
      try {
        await worker.reinitialize(lang, 1);
        const { data } = await worker.recognize(path);
        results[name] = { lang, text: data.text, confidence: data.confidence };
      } catch (e) {
        results[name] = { lang, error: String(e).slice(0, 300) };
      }
    }
    await worker.terminate();
  } catch (e) {
    results.fatal = String(e).slice(0, 500);
  }
  window.__OCR__ = results;
  set("OCR_DONE\n" + JSON.stringify(results));
})();
</script>
</body>
</html>
